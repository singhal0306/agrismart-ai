<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Recommendation Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">🌱</div>
          <span>AgriSmart AI</span>
        </div>
        <div class="status-pill">Live field assistant</div>
      </header>

      <main class="main-panel">
        <section class="hero">
          <div class="tag">AI-powered farming</div>
          <h1>Smarter crop decisions for better harvests.</h1>
          <p>
            Get crop recommendations based on soil and weather conditions, and estimate price trends for your market.
          </p>

          <div class="quick-actions">
            <button class="quick-action" data-choice="1">1. Crop recommendation</button>
            <button class="quick-action" data-choice="2">2. Price prediction</button>
          </div>
        </section>

        <section class="chat-panel">
          <div class="chat-header">
            <div class="chat-header-left">
              <div class="avatar">AI</div>
              <div class="chat-name">
                <h3>Crop Advisor</h3>
                <p>Ask me anything</p>
              </div>
            </div>
            <div class="online-dot" aria-label="online"></div>
          </div>

          <div id="messageBox" class="chat-body">
            <div class="message bot">
              <div class="bubble">{{ welcome_message | safe }}</div>
            </div>
          </div>

          <form id="chatForm" class="chat-form">
            <input
              id="userInput"
              type="text"
              name="msg"
              placeholder="Type your answer here..."
              autocomplete="off"
              required
            />
            <button type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const messageBox = document.getElementById('messageBox');
      const quickButtons = document.querySelectorAll('.quick-action');

      function addMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text;

        wrapper.appendChild(bubble);
        messageBox.appendChild(wrapper);
        messageBox.scrollTop = messageBox.scrollHeight;
      }

      function sendMessage(prompt) {
        if (!prompt.trim()) return;

        addMessage(prompt, 'user');
        userInput.value = '';

        fetch('/get', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body: new URLSearchParams({ msg: prompt })
        })
          .then((response) => response.json())
          .then((data) => {
            addMessage(data.result, 'bot');
          })
          .catch((error) => {
            console.error('Error:', error);
            addMessage('Something went wrong. Please try again.', 'bot');
          });
      }

      chatForm.addEventListener('submit', function (event) {
        event.preventDefault();
        sendMessage(userInput.value);
      });

      quickButtons.forEach((button) => {
        button.addEventListener('click', function () {
          sendMessage(button.dataset.choice);
        });
      });
    </script>
  </body>
</html>
